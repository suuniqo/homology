[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homology"
version = "0.1.0"
description = "Persistent homology experiments"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "jupyter"
]

[project.optional-dependencies]
dev = ["pytest"]
